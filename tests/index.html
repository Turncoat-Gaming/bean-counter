<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>bean-counter — tests</title>
  <link rel="stylesheet" href="../src/styles.css" />
  <style>
    .ok { color: #6bdc8a; } .fail { color: var(--error); }
    li { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <header class="topbar"><h1>bean-counter · tests</h1></header>
  <main>
    <section class="panel"><ul id="out"></ul><p id="summary"></p></section>
  </main>

  <!-- Classic scripts so the tests also run over file://. -->
  <script src="../src/engine/calculator.js"></script>
  <script src="../src/engine/plan-codec.js"></script>
  <script src="engine.test.js"></script>
  <script>
    (function () {
      var out = document.querySelector('#out');
      var failed = 0;
      var tests = window.BeanCounter.tests;
      tests.forEach(function (entry) {
        var name = entry[0], fn = entry[1];
        var li = document.createElement('li');
        try { fn(); li.className = 'ok'; li.textContent = 'ok   ' + name; }
        catch (err) { failed++; li.className = 'fail'; li.textContent = 'FAIL ' + name + ' — ' + err.message; }
        out.append(li);
      });
      var s = document.querySelector('#summary');
      s.textContent = failed ? (failed + ' failing') : (tests.length + ' passing');
      s.className = failed ? 'fail' : 'ok';
    })();
  </script>
</body>
</html>
