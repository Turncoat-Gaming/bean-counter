<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Lock down what can execute/load: only our own scripts and styles, no
       inline script, no external origins. GitHub Pages can't set HTTP headers,
       so this is enforced via meta. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <title>bean-counter — a Satisfactory planner</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>bean-counter</h1>
    <div class="settings">
      <div class="field inline">
        <label for="version">Game data</label>
        <select id="version"></select>
      </div>
      <div class="field inline">
        <label for="cost-mult" title="Advanced Game Settings: recipe parts cost multiplier">Recipe cost</label>
        <select id="cost-mult"></select>
      </div>
      <div class="field inline">
        <label for="power-mult" title="Advanced Game Settings: machine power consumption multiplier">Power</label>
        <select id="power-mult"></select>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    A personal <a href="https://www.satisfactorygame.com/" rel="noreferrer">Satisfactory</a>
    planner. Runs entirely in your browser — clone it and open this file. ·
    <a href="https://github.com/Turncoat-Gaming/bean-counter" rel="noreferrer">source</a>
  </footer>

  <!-- Classic scripts + script-loaded data: no ES modules, no fetch(), so this
       page runs directly from the filesystem (file://). Order matters: engine,
       then data, then UI, then bootstrap. Add a new dataset's recipes.js here. -->
  <script src="src/engine/calculator.js"></script>
  <script src="src/engine/plan-codec.js"></script>
  <script src="src/engine/dataset.js"></script>
  <script src="src/engine/solver.js"></script>
  <script src="src/data/versions.js"></script>
  <script src="src/data/1.2/recipes.js"></script>
  <script src="src/ui/rate-calculator.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
